spring.application.name=alunoscrud

# --- Configuração do Banco de Dados (PostgreSQL via Docker) ---
# A URL conecta no localhost porta 5432, base de dados "alunos_db"
spring.datasource.url=jdbc:postgresql://localhost:5432/alunos_db

# Credenciais (que definiremos no docker-compose amanhã)
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update': cria/atualiza as tabelas automaticamente baseado na tua entidade Aluno
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL formatado no console (ótimo para aprenderes o que o JPA está a fazer)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true